# Slurm cluster for GPU training: 4 x 8-GPU nodes, cgroup isolation, fair-share, topology-aware placement.
ClusterName=ai-hpc
SlurmctldHost=slurm-ctl01
AuthType=auth/munge
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
GresTypes=gpu
SchedulerType=sched/backfill
PriorityType=priority/multifactor
PriorityWeightFairshare=100000
PriorityWeightAge=1000
PriorityWeightQOS=10000
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageTRES=gres/gpu
JobAcctGatherType=jobacct_gather/cgroup
TopologyPlugin=topology/tree
PrologFlags=Alloc,Contain
# Pyxis/Enroot: `srun --container-image=nvcr.io#nvidia/pytorch:25.01-py3 ...`
PlugStackConfig=/etc/slurm/plugstack.conf
ReturnToService=2
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd

NodeName=gpu[01-04] CPUs=192 Sockets=2 CoresPerSocket=48 ThreadsPerCore=2 RealMemory=2000000 Gres=gpu:h100:8 State=UNKNOWN
PartitionName=train Nodes=gpu[01-04] Default=YES MaxTime=3-00:00:00 State=UP OverSubscribe=EXCLUSIVE
PartitionName=interactive Nodes=gpu[01-04] MaxTime=08:00:00 State=UP DefMemPerGPU=200000 MaxNodes=1
