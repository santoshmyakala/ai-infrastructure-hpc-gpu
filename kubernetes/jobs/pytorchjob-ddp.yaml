# Multi-node DDP training (Kubeflow Training Operator) admitted through Kueue.
# 2 nodes x 8 GPUs; torchrun reads MASTER_ADDR/WORLD_SIZE/RANK injected by the operator.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: ddp-scaling-test
  namespace: ml-research
  labels:
    kueue.x-k8s.io/queue-name: research
spec:
  nprocPerNode: "8"
  runPolicy:
    cleanPodPolicy: Running
    backoffLimit: 2
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          tolerations:
            - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
          containers:
            - name: pytorch
              image: nvcr.io/nvidia/pytorch:25.01-py3
              command: ["torchrun", "/workspace/train_ddp.py", "--amp", "--epochs", "5", "--samples", "4000000"]
              env:
                - { name: NCCL_DEBUG, value: WARN }
              resources:
                limits: { nvidia.com/gpu: 8, memory: 512Gi }
                requests: { cpu: "48", memory: 512Gi, nvidia.com/gpu: 8 }
              volumeMounts:
                - { name: code, mountPath: /workspace }
                - { name: dshm, mountPath: /dev/shm }
          volumes:
            - name: code
              configMap: { name: train-ddp }
            - name: dshm                      # NCCL needs a large shared-memory segment
              emptyDir: { medium: Memory, sizeLimit: 64Gi }
    Worker:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          tolerations:
            - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
          containers:
            - name: pytorch
              image: nvcr.io/nvidia/pytorch:25.01-py3
              command: ["torchrun", "/workspace/train_ddp.py", "--amp", "--epochs", "5", "--samples", "4000000"]
              resources:
                limits: { nvidia.com/gpu: 8, memory: 512Gi }
                requests: { cpu: "48", memory: 512Gi, nvidia.com/gpu: 8 }
              volumeMounts:
                - { name: code, mountPath: /workspace }
                - { name: dshm, mountPath: /dev/shm }
          volumes:
            - name: code
              configMap: { name: train-ddp }
            - name: dshm
              emptyDir: { medium: Memory, sizeLimit: 64Gi }
