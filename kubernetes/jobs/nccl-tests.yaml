# Single-node NCCL all-reduce bandwidth test: the first thing to run on a new GPU node.
# Expect bus bandwidth close to the NVLink/NVSwitch spec (H100 SXM: hundreds of GB/s).
apiVersion: batch/v1
kind: Job
metadata:
  name: nccl-allreduce-8gpu
  namespace: ml-research
  labels:
    kueue.x-k8s.io/queue-name: research
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
      containers:
        - name: nccl
          image: nvcr.io/nvidia/pytorch:25.01-py3
          command: ["bash", "-c"]
          args:
            - |
              git clone --depth 1 https://github.com/NVIDIA/nccl-tests /tmp/nccl-tests &&
              make -C /tmp/nccl-tests -j MPI=0 &&
              /tmp/nccl-tests/build/all_reduce_perf -b 8M -e 8G -f 2 -g 8
          resources:
            limits: { nvidia.com/gpu: 8, memory: 64Gi }
            requests: { cpu: "16", memory: 64Gi, nvidia.com/gpu: 8 }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 32Gi }
